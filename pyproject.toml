[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice_lib"
version = "0.1.0"
description = "SageMath tools for lattice-based cryptography over cyclotomic rings"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Russell W. F. Lai" }]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# SageMath is the runtime, not a pip-installable dependency: install this into
# a Sage environment with `sage -pip install -e .`.
dependencies = []

[tool.setuptools]
packages = ["lattice_lib"]
